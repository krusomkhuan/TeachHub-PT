; =====================================================================
; ไฟล์: .user.ini (สำหรับโฮสติ้งที่รัน PHP แบบ PHP-FPM / FastCGI เช่น cPanel, DirectAdmin, Plesk)
; ตั้งค่าขนาดไฟล์อัปโหลดและเขตเวลา — บน XAMPP ไฟล์นี้จะไม่มีผล (ตั้งใน php.ini แทน)
; หลังแก้ไขอาจต้องรอประมาณ 5 นาทีจึงมีผล
; =====================================================================
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
date.timezone = Asia/Bangkok
display_errors = Off
log_errors = On
session.use_strict_mode = 1
session.cookie_httponly = 1
